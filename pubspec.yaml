name: fintrack_app
description: "FinTrack - Control de Gastos Hormiga para Universitarios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  # Persistencia Local (SQLite y Preferences)
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2

  # Manejo de Estado
  provider: ^6.1.1

  # Capacidades Móviles Nativas
  image_picker: ^1.0.7
  connectivity_plus: ^7.3.2

  # Generación y Descarga de Reportes PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Utilidades
  intl: ^0.20.3
  crypto: ^3.0.3
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/ilus/
